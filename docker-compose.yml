version: '3.8'

services:
  database:
    image: postgres:16-alpine
    container_name: local_database
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: local_backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@database:5432/${DB_NAME}
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - backend_net
      - frontend_net
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: local_frontend
    ports:
      - "80:80"
    networks:
      - frontend_net
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
    driver: local

networks:
  frontend_net:
    driver: bridge
  backend_net:
    driver: bridge